name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Smoke test
        run: |
          pnpm seed
          pnpm start &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4100/api/v1/health > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://localhost:4100/api/v1/health
          curl -sf http://localhost:4100/openapi.json > /dev/null
          curl -sf -c cookies.txt -X POST http://localhost:4100/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"priya@brightloom.test","password":"demo-pass-2026"}' > /dev/null
          curl -sf -b cookies.txt http://localhost:4100/api/v1/me > /dev/null
          curl -sf http://localhost:4100/ | grep -q '<div id="root">'
